<svg width="900" height="620" viewBox="0 0 900 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C960"/>
      <stop offset="100%" stop-color="#C89B3C"/>
    </linearGradient>
    <linearGradient id="bookSpine1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EFD8A9"/>
      <stop offset="100%" stop-color="#E4C58A"/>
    </linearGradient>
    <linearGradient id="bookSpine2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7E8C6"/>
      <stop offset="100%" stop-color="#ECD9B1"/>
    </linearGradient>
    <linearGradient id="bookSpine3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#C89B3C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="32" fill="#102E2A"/>

  <!-- Geometric tessellation background -->
  <g opacity="0.06">
    <pattern id="archPattern" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M24 0L48 24L24 48L0 24Z" fill="none" stroke="#14b8a6" stroke-width="0.5"/>
      <path d="M24 8L40 24L24 40L8 24Z" fill="none" stroke="#14b8a6" stroke-width="0.3"/>
      <circle cx="24" cy="24" r="4" fill="none" stroke="#14b8a6" stroke-width="0.3"/>
    </pattern>
    <rect width="900" height="620" fill="url(#archPattern)"/>
  </g>

  <!-- Mihrab / Islamic arch outer -->
  <path d="M140 580V230C140 110 285 40 450 40C615 40 760 110 760 230V580" stroke="url(#goldFrame)" stroke-width="6" fill="none"/>

  <!-- Mihrab inner arch -->
  <path d="M170 580V240C170 135 298 72 450 72C602 72 730 135 730 240V580" stroke="#C8A86B" stroke-width="2.5" fill="none" opacity="0.4"/>

  <!-- Muqarnas-style decoration at arch top -->
  <g transform="translate(350, 50)" opacity="0.35">
    <!-- Central star -->
    <path d="M100 0L112 38L150 50L112 62L100 100L88 62L50 50L88 38Z" fill="#D4A853" opacity="0.3"/>
    <path d="M100 0L112 38L150 50L112 62L100 100L88 62L50 50L88 38Z" fill="#D4A853" opacity="0.2" transform="rotate(22.5,100,50)"/>
    <circle cx="100" cy="50" r="14" fill="none" stroke="#C8A86B" stroke-width="1.5"/>
    <circle cx="100" cy="50" r="8" fill="#D4A853" opacity="0.2"/>
  </g>

  <!-- Small decorative arches (muqarnas tiers) -->
  <g opacity="0.2">
    <path d="M250 145C250 125 290 110 330 110C370 110 410 125 410 145" stroke="#C8A86B" stroke-width="1.5" fill="none"/>
    <path d="M390 145C390 125 430 110 470 110C510 110 550 125 550 145" stroke="#C8A86B" stroke-width="1.5" fill="none"/>
    <path d="M530 145C530 125 570 110 610 110C650 110 690 125 690 145" stroke="#C8A86B" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Shelf base -->
  <rect x="190" y="520" width="520" height="8" rx="2" fill="#D8B06A" opacity="0.6"/>

  <!-- Book volumes on shelf -->
  <!-- Book 1 - tall, cream -->
  <rect x="210" y="275" width="65" height="245" rx="6" fill="url(#bookSpine1)" stroke="#D5BF93" stroke-width="1.5"/>
  <path d="M225 300H260" stroke="#A66B35" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M225 325H255" stroke="#A66B35" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M225 350H250" stroke="#A66B35" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Book 1 decorative band -->
  <rect x="210" y="280" width="65" height="4" rx="1" fill="#C8A86B" opacity="0.4"/>
  <rect x="210" y="510" width="65" height="4" rx="1" fill="#C8A86B" opacity="0.4"/>

  <!-- Book 2 - medium, light -->
  <rect x="290" y="310" width="55" height="210" rx="6" fill="url(#bookSpine2)" stroke="#D5BF93" stroke-width="1.5"/>
  <path d="M305 335H330" stroke="#A66B35" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M305 360H325" stroke="#A66B35" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Star ornament on spine -->
  <g transform="translate(306, 430)" opacity="0.3">
    <path d="M8 0L10 6L16 8L10 10L8 16L6 10L0 8L6 6Z" fill="#C8A86B"/>
  </g>

  <!-- Book 3 - tallest, gold -->
  <rect x="360" y="240" width="70" height="280" rx="6" fill="url(#bookSpine3)" opacity="0.7" stroke="#B8942F" stroke-width="1.5"/>
  <path d="M380 270H415" stroke="#8B6914" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M380 295H410" stroke="#8B6914" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M380 320H405" stroke="#8B6914" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Decorative bands -->
  <rect x="360" y="248" width="70" height="5" rx="1" fill="#E8C960" opacity="0.3"/>
  <rect x="360" y="510" width="70" height="5" rx="1" fill="#E8C960" opacity="0.3"/>

  <!-- Book 4 - medium, cream -->
  <rect x="445" y="300" width="55" height="220" rx="6" fill="url(#bookSpine1)" stroke="#D5BF93" stroke-width="1.5"/>
  <path d="M460 325H485" stroke="#A66B35" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M460 350H480" stroke="#A66B35" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Circle ornament -->
  <circle cx="472" cy="440" r="8" fill="none" stroke="#C8A86B" stroke-width="1" opacity="0.3"/>
  <circle cx="472" cy="440" r="4" fill="#C8A86B" opacity="0.15"/>

  <!-- Book 5 - short, warm -->
  <rect x="515" y="350" width="60" height="170" rx="6" fill="#E4C58A" stroke="#D5BF93" stroke-width="1.5"/>
  <path d="M530 375H560" stroke="#A66B35" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M530 400H555" stroke="#A66B35" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Book 6 - tall, light gold -->
  <rect x="590" y="265" width="65" height="255" rx="6" fill="url(#bookSpine2)" stroke="#D5BF93" stroke-width="1.5"/>
  <path d="M605 290H640" stroke="#A66B35" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M605 315H635" stroke="#A66B35" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M605 340H630" stroke="#A66B35" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Decorative bands -->
  <rect x="590" y="270" width="65" height="4" rx="1" fill="#C8A86B" opacity="0.3"/>
  <rect x="590" y="512" width="65" height="4" rx="1" fill="#C8A86B" opacity="0.3"/>

  <!-- Decorative elements at arch base -->
  <g opacity="0.25">
    <!-- Left column decoration -->
    <rect x="145" y="400" width="16" height="180" rx="4" fill="#C8A86B"/>
    <circle cx="153" cy="405" r="5" fill="#D4A853" opacity="0.5"/>
    <circle cx="153" cy="570" r="5" fill="#D4A853" opacity="0.5"/>
    <!-- Right column decoration -->
    <rect x="739" y="400" width="16" height="180" rx="4" fill="#C8A86B"/>
    <circle cx="747" cy="405" r="5" fill="#D4A853" opacity="0.5"/>
    <circle cx="747" cy="570" r="5" fill="#D4A853" opacity="0.5"/>
  </g>

  <!-- Corner rosettes -->
  <g transform="translate(30, 30)" opacity="0.15">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <path d="M15 3L18 12L27 15L18 18L15 27L12 18L3 15L12 12Z" fill="#14b8a6" opacity="0.4"/>
  </g>
  <g transform="translate(835, 30)" opacity="0.15">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <path d="M15 3L18 12L27 15L18 18L15 27L12 18L3 15L12 12Z" fill="#14b8a6" opacity="0.4"/>
  </g>
</svg>