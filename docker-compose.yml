services:
  db:
    image: postgres:15-alpine
    container_name: search_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      # The postgres image reads the password from this file itself.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - search_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  es:
    image: elasticsearch:8.11.1
    container_name: search_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx2g
      # Dev host runs with little free disk; defaults (85/90/95%) block shard
      # allocation and force indices read-only long before the disk is full.
      - cluster.routing.allocation.disk.watermark.low=93%
      - cluster.routing.allocation.disk.watermark.high=96%
      - cluster.routing.allocation.disk.watermark.flood_stage=98%
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - search_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      # ES needs ~2 min to bind 9200 on this host. Without a start_period the
      # retry budget is spent on boot and compose declares the node unhealthy
      # seconds before it comes up, taking every depends_on service with it.
      start_period: 180s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: search_redis
    volumes:
      - redis_data:/data
    networks:
      - search_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: search_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      # MinIO resolves the *_FILE form natively.
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    secrets:
      - minio_root_password
    networks:
      - search_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    container_name: search_createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        # mc takes the password as an argv, so it has to be read here. $$ escapes
        # compose interpolation; the quotes keep a password containing spaces
        # from being word-split into separate arguments.
        mc alias set myminio http://minio:9000 '${MINIO_ROOT_USER}' "$$(cat /run/secrets/minio_root_password)"
        mc mb myminio/documents || true
        mc anonymous set download myminio/documents || true
        echo 'Bucket documents created successfully'
    secrets:
      - minio_root_password
    networks:
      - search_net
    restart: "no"

  ocr-tesseract:
    build:
      context: ./ocr_services/tesseract
      dockerfile: Dockerfile
    container_name: search_ocr_tesseract
    environment:
      - OCR_LANG=${OCR_LANG:-ara+eng+fas+urd}
      - OCR_DPI=${OCR_DPI:-200}
      - OCR_WORDS_LANG=${OCR_WORDS_LANG:-ara}
    ports:
      - "7860:7860"
    networks:
      - search_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ocr-chandra:
    build:
      context: ./ocr_services/chandra
      dockerfile: Dockerfile
    container_name: search_ocr_chandra
    profiles: ["gpu"]
    environment:
      - CHANDRA_METHOD=${CHANDRA_METHOD:-hf}
      - CHANDRA_TIMEOUT=${CHANDRA_TIMEOUT:-1800}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ocr_chandra_models:/root/.cache/huggingface
    ports:
      - "7861:7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    networks:
      - search_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  ocr-docling:
    build:
      context: ./ocr_services/docling
      dockerfile: Dockerfile
    container_name: search_ocr_docling
    profiles: ["docling"]
    environment:
      - DOCLING_OCR_ENABLED=${DOCLING_OCR_ENABLED:-false}
      - DOCLING_OCR_LANG=${DOCLING_OCR_LANG:-ar,en,fa,ur}
      - DOCLING_TABLE_MODE=${DOCLING_TABLE_MODE:-fast}
      - HF_HOME=/root/.cache/huggingface
      # Keep the model runtimes from spawning a thread per core; on a 2-CPU host
      # the extra parallelism inflates RSS without speeding things up.
      - OMP_NUM_THREADS=${DOCLING_OMP_THREADS:-2}
      - MKL_NUM_THREADS=${DOCLING_OMP_THREADS:-2}
      - TORCH_NUM_THREADS=${DOCLING_OMP_THREADS:-2}
    volumes:
      - ocr_docling_models:/root/.cache/huggingface
    ports:
      - "7862:7860"
    networks:
      - search_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # Cap memory so a single oversized PDF cannot OOM-kill the host.
    # Host has 7.8 GB RAM, no swap; ES alone takes ~2 GB. 3 GB leaves docling
    # enough headroom for layout + table models while protecting other services.
    mem_limit: ${DOCLING_MEM_LIMIT:-3g}
    memswap_limit: ${DOCLING_MEM_LIMIT:-3g}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: search_backend
    command: >
      sh -c "
      if [ \"$${ENVIRONMENT:-prod}\" = \"dev\" ]; then
        python manage.py runserver 0.0.0.0:8000
      else
        gunicorn ilm_shamela.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
      fi
      "
    ports:
      # Host-side port only. Caddy and the frontend reach the backend at
      # backend:8000 over the internal network, so overriding this affects
      # direct host access alone (http://localhost:<port>/).
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - staticfiles:/app/staticfiles
      - kb_data:/app/data/kb
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_HOST=es:9200
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_root_password
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_STORAGE_BUCKET_NAME=documents
      - SECRET_KEY_FILE=/run/secrets/django_secret_key
      - DEBUG=${DEBUG:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://localhost:3000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://localhost,http://localhost,https://127.0.0.1,http://127.0.0.1}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET_FILE=/run/secrets/google_client_secret
      - GEMINI_API_KEY_FILE=/run/secrets/gemini_api_key
      - OPENROUTER_API_KEY_FILE=/run/secrets/openrouter_api_key
      - OPENROUTER_CHAT_MODEL=${OPENROUTER_CHAT_MODEL:-google/gemini-2.5-flash-lite}
      - OPENROUTER_AGENT_MODEL=${OPENROUTER_AGENT_MODEL:-google/gemini-3.1-flash-lite}
      - OPENROUTER_NER_MODEL=${OPENROUTER_NER_MODEL:-google/gemini-2.5-flash}
      - KB_DATA_DIR=/app/data/kb
      - KB_SPLIT_MODEL=${KB_SPLIT_MODEL:-deepseek/deepseek-v4-flash}
      - KB_EXTRACT_MODEL=${KB_EXTRACT_MODEL:-gemini-3.1-pro-preview}
      - KB_THINKING_LEVEL=${KB_THINKING_LEVEL:-medium}
      - KB_AUTO_ENABLED=${KB_AUTO_ENABLED:-true}
      - KB_MAX_AUTO_COST_USD=${KB_MAX_AUTO_COST_USD:-15}
      - KB_MAX_DOC_CHARS=${KB_MAX_DOC_CHARS:-4000000}
      - OPENROUTER_REFERER=${OPENROUTER_REFERER:-https://ilmshamela.com}
      - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
      - ANTHROPIC_CHAT_MODEL=${ANTHROPIC_CHAT_MODEL:-claude-sonnet-4-6}
      - OCR_TESSERACT_URL=${OCR_TESSERACT_URL:-http://ocr-tesseract:7860}
      - OCR_CHANDRA_URL=${OCR_CHANDRA_URL:-http://ocr-chandra:7860}
      - OCR_DOCLING_URL=${OCR_DOCLING_URL:-http://ocr-docling:7860}
      - OCR_DEFAULT_ENGINE=${OCR_DEFAULT_ENGINE:-tesseract}
      - OCR_TIMEOUT=${OCR_TIMEOUT:-1800}
      - MAX_DOCUMENT_FILE_SIZE_MB=${MAX_DOCUMENT_FILE_SIZE_MB:-100}
      - READER_MAX_DOCS_PER_DAY=${READER_MAX_DOCS_PER_DAY:-50}
      - READER_MAX_PAGES_PER_DAY=${READER_MAX_PAGES_PER_DAY:-5000}
      - ACCOUNT_EMAIL_VERIFICATION=${ACCOUNT_EMAIL_VERIFICATION:-optional}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      es:
        condition: service_healthy
    secrets:
      - django_secret_key
      - postgres_password
      - minio_root_password
      - google_client_secret
      - gemini_api_key
      - openrouter_api_key
      - anthropic_api_key
    networks:
      - search_net
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: search_celery_worker
    command: celery -A ilm_shamela worker --loglevel=info --concurrency=2
    volumes:
      # Volumes mounted for dev mode hot-reload
      # In production, volumes can be kept as celery needs code access, or removed for true production
      - ./backend:/app
      - kb_data:/app/data/kb
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_HOST=es:9200
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_root_password
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_STORAGE_BUCKET_NAME=documents
      - SECRET_KEY_FILE=/run/secrets/django_secret_key
      - DEBUG=${DEBUG:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://localhost:3000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://localhost,http://localhost,https://127.0.0.1,http://127.0.0.1}
      - GEMINI_API_KEY_FILE=/run/secrets/gemini_api_key
      - OPENROUTER_API_KEY_FILE=/run/secrets/openrouter_api_key
      - OPENROUTER_CHAT_MODEL=${OPENROUTER_CHAT_MODEL:-google/gemini-2.5-flash-lite}
      - OPENROUTER_AGENT_MODEL=${OPENROUTER_AGENT_MODEL:-google/gemini-3.1-flash-lite}
      - OPENROUTER_NER_MODEL=${OPENROUTER_NER_MODEL:-google/gemini-2.5-flash}
      - KB_DATA_DIR=/app/data/kb
      - KB_SPLIT_MODEL=${KB_SPLIT_MODEL:-deepseek/deepseek-v4-flash}
      - KB_EXTRACT_MODEL=${KB_EXTRACT_MODEL:-gemini-3.1-pro-preview}
      - KB_THINKING_LEVEL=${KB_THINKING_LEVEL:-medium}
      - KB_AUTO_ENABLED=${KB_AUTO_ENABLED:-true}
      - KB_MAX_AUTO_COST_USD=${KB_MAX_AUTO_COST_USD:-15}
      - KB_MAX_DOC_CHARS=${KB_MAX_DOC_CHARS:-4000000}
      - OPENROUTER_REFERER=${OPENROUTER_REFERER:-https://ilmshamela.com}
      - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
      - ANTHROPIC_CHAT_MODEL=${ANTHROPIC_CHAT_MODEL:-claude-sonnet-4-6}
      - OCR_TESSERACT_URL=${OCR_TESSERACT_URL:-http://ocr-tesseract:7860}
      - OCR_CHANDRA_URL=${OCR_CHANDRA_URL:-http://ocr-chandra:7860}
      - OCR_DOCLING_URL=${OCR_DOCLING_URL:-http://ocr-docling:7860}
      - OCR_DEFAULT_ENGINE=${OCR_DEFAULT_ENGINE:-tesseract}
      - OCR_TIMEOUT=${OCR_TIMEOUT:-1800}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      es:
        condition: service_healthy
      backend:
        condition: service_started
      ocr-tesseract:
        condition: service_started
    secrets:
      - django_secret_key
      - postgres_password
      - minio_root_password
      - gemini_api_key
      - openrouter_api_key
      - anthropic_api_key
    networks:
      - search_net
    restart: unless-stopped

  agent:
    # CopilotKit deep-agent sidecar. Reuses the backend image (same context) but
    # bypasses entrypoint.sh (no migrations/superuser) and serves the AG-UI
    # endpoint that the Next.js /api/copilotkit runtime bridges to.
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: search_agent
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${ENVIRONMENT:-prod}" = "dev" ]; then
          exec uvicorn agent_service.main:app --host 0.0.0.0 --port 8123 --reload
        else
          exec uvicorn agent_service.main:app --host 0.0.0.0 --port 8123
        fi
    ports:
      - "8123:8123"
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_HOST=es:9200
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_root_password
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_STORAGE_BUCKET_NAME=documents
      - SECRET_KEY_FILE=/run/secrets/django_secret_key
      - DEBUG=${DEBUG:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - GEMINI_API_KEY_FILE=/run/secrets/gemini_api_key
      - OPENROUTER_API_KEY_FILE=/run/secrets/openrouter_api_key
      - OPENROUTER_CHAT_MODEL=${OPENROUTER_CHAT_MODEL:-google/gemini-2.5-flash-lite}
      - OPENROUTER_AGENT_MODEL=${OPENROUTER_AGENT_MODEL:-google/gemini-3.1-flash-lite}
      - OPENROUTER_REFERER=${OPENROUTER_REFERER:-https://ilmshamela.com}
      - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
      - ANTHROPIC_CHAT_MODEL=${ANTHROPIC_CHAT_MODEL:-claude-sonnet-4-6}
    depends_on:
      db:
        condition: service_healthy
      es:
        condition: service_healthy
      backend:
        condition: service_started
    secrets:
      - django_secret_key
      - postgres_password
      - minio_root_password
      - gemini_api_key
      - openrouter_api_key
      - anthropic_api_key
    networks:
      - search_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
      args:
        # Baked into the production bundle at build time (NEXT_PUBLIC_* are inlined).
        NEXT_PUBLIC_API_URL: http://backend:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: search_frontend
    # Production: run the built standalone server (image CMD `node server.js`).
    # For local frontend hot-reload, run `make frontend-dev` on the host instead.
    ports:
      - "3000:3000"
    environment:
      # Frontend (Next.js) server-side code runs inside this container.
      # It should talk directly to the Django backend service over the Docker network.
      # The frontend browser code will still use relative URLs (see frontend/lib/api.ts),
      # which Caddy will proxy from https://localhost/api -> http://backend:8000/.
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      # Server-side only: the /api/copilotkit route handler bridges to the agent sidecar.
      - AGENT_SERVICE_URL=${AGENT_SERVICE_URL:-http://agent:8123}
      - COPILOTKIT_TELEMETRY_DISABLED=${COPILOTKIT_TELEMETRY_DISABLED:-true}
    depends_on:
      - backend
      - agent
    networks:
      - search_net
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: search_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - staticfiles:/var/www/staticfiles:ro
    depends_on:
      - backend
      - frontend
    networks:
      - search_net
    restart: unless-stopped

volumes:
  postgres_data:
  elasticsearch_data:
  redis_data:
  minio_data:
  staticfiles:
  ocr_chandra_models:
  ocr_docling_models:
  caddy_data:
  caddy_config:
  # KB pipeline outputs + LLM-response cache (extraction/kb/). Named volume so
  # paid, cached LLM answers survive container restarts and host-repo resets.
  kb_data:

secrets:
  # File-backed secrets. Compose mounts each one read-only at
  # /run/secrets/<name> inside only the services that declare it, so the values
  # stay out of `docker inspect`, `docker compose config`, and the environment
  # of every service that has no business reading them.
  #
  # These files are gitignored and do not exist on a fresh clone. Create them
  # with `make secrets` (or `bash scripts/init-secrets.sh`) before the first
  # `up` — compose refuses to start when a source file is missing.
  django_secret_key:
    file: ./secrets/django_secret_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  google_client_secret:
    file: ./secrets/google_client_secret.txt
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt

networks:
  search_net:
    driver: bridge
